spring.application.name=ShopNow

# MongoDB Atlas Connection
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/shopnow}
spring.data.mongodb.database=shopnow

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# Razorpay
#razorpay.key.id=${RAZORPAY_KEY_ID}
#razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# Add your local or deployed frontend URLs here (comma-separated):
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500
# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
